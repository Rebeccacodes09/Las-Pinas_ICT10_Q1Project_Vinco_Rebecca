<!DOCTYPE html>
<html>
<head>
    <title>SKU Generator</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>

<style>
body {
background: linear-gradient(135deg, #84caeb, #000000);
min-height: 100vh;
font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}

.container {
padding-top: 50px;
padding-bottom: 50px;
}

.main-card {
border: none;
border-radius: 20px;
overflow: hidden;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.header {
background: #212529;
color: white;
padding: 30px;
text-align: center;
}

.info-card {
border: none;
border-radius: 15px;
height: 100%;
transition: transform 0.2s;
}

.info-card:hover {
transform: translateY(-5px);
}

</style>

<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-dark">
    <div class="container">
        
        <a class="navbar-brand" href="index.html">
            Skewtore
        </a>

        <div>
            <a class="btn btn-outline-light btn-sm" href="index.html">
                Receipt Generator
            </a>

            <a class="btn btn-outline-light btn-sm" href="sku.html">
                SKU Generator
            </a>
        </div>

    </div>
</nav>


    <!-- SKU Generator -->
    <div class="container mt-5">
        <div class="card shadow-sm">

            <div class="card-body">

                <h1 class="text-center mb-4">SKU Generator</h1>

                <div class="mb-3">
                    <label class="form-label">
                        Product Category
                    </label>

                    <input type="text"
                           id="category"
                           class="form-control"
                           placeholder="Example: Food">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Product Name
                    </label>

                    <input type="text"
                           id="product_name"
                           class="form-control"
                           placeholder="Example: Burger">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Stock Quantity
                    </label>

                    <input type="number"
                           id="quantity"
                           class="form-control"
                           placeholder="Example: 25">
                </div>

                <button class="btn btn-primary" py-click="SKU_generator">
                    Generate SKU
                </button>

                <div id="sku_output" class="mt-4"></div>

            </div>
        </div>
    </div>

    <!-- Python -->
    <script type="py">

from pyscript import display, document

def SKU_generator(e):

    document.getElementById("sku_output").innerHTML = ""

    category = document.getElementById("category").value
    product_name = document.getElementById("product_name").value
    stock_qty = document.getElementById("quantity").value

    sku = (
        category[:3].upper()
        + "-"
        + product_name[:4].upper()
        + "-"
        + str(stock_qty)
    )

    display("SKU: " + sku, target="sku_output")

    </script>

</body>
</html>
